name: Publish Python examples
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: python-examples-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.27'
      - uses: actions/checkout@v4
        with:
          repository: Erasmus-CTM/ai-feedback
          ref: main
          path: _feedback-source
      - run: quarto add ./_feedback-source --no-prompt
      - name: Test the published example requirements
        run: python -m unittest discover -s tests
      - name: Build the standalone pages
        run: python scripts/build-example-site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the examples
        id: deployment
        uses: actions/deploy-pages@v4
