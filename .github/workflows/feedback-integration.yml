name: Shared feedback integration

on:
  push:
    branches: [main, 'feature/shared-feedback-integration']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feedback-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.27'
      - name: Install checker test dependencies
        run: python -m pip install sympy==1.14.0 networkx==3.4.2
      - name: Fetch exact sources, render common page and run regressions
        run: python scripts/setup-feedback-integration.py --test
      - name: Install Chromium
        working-directory: integration/feedback
        run: npx playwright install --with-deps chromium
      - name: Test real browser execution on the common page
        working-directory: integration/feedback
        env:
          CTM_INTEGRATION_SITE: ${{ github.workspace }}/.feedback-workspace/site/_site
        run: npm run test:browser
      - name: Keep common page, revision record and browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feedback-integration
          path: |
            .feedback-workspace/site/_site
            .feedback-workspace/resolved-repos.json
