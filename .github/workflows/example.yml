name: Build standalone example
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Select explicit review dependencies (main keeps normal defaults)
        id: review
        env:
          REVIEW_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/review-dependencies.py
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.27'
      - name: Fetch ctm-libs, the library of CTM Assessment
        uses: actions/checkout@v4
        with:
          repository: Erasmus-CTM/ctm-libs
          ref: ${{ steps.review.outputs['ctm-libs'] || '41b2be0a94a5bbf9dd8389fa83458d23692f2b4a' }}
          path: _ctm-libs-source
      - name: Install ctm-libs (a component build without the CTM Assessment package)
        run: |
          quarto add ./_ctm-libs-source --no-prompt
          test -f _extensions/ctm-libs/lua/ctm.lua || { echo "::error::ctm-libs was not installed (is the ref a ctm-libs 0.9 or later commit?)"; exit 1; }
          echo "CTM_LIBS_EXTENSION=$GITHUB_WORKSPACE/_ctm-libs-source/_extensions/ctm-libs" >> "$GITHUB_ENV"
          # py-exercise stops without the CTM Assessment package unless the
          # build says it is a component development build.
          echo "CTM_COMPONENT_DEV=1" >> "$GITHUB_ENV"
      - name: Test the published example requirements
        run: python -m unittest discover -s tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the browser runtime (jsdom)
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Render standalone example
        run: |
          quarto render example.qmd
          quarto render example-en.qmd
          quarto render example-mini.qmd
          test -f example-en.html
          test -f example-mini.html
          test -f example.html || test -f _site/example.html
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-example
          path: |
            example.html
            example_files
            example-en.html
            example-mini.html
            _site
